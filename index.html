<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคีย์ออเดอร์ - นครปฐม</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .btn-add { background-color: #e9ecef; color: #495057; border: 1px dashed #adb5bd; }
        .btn-add:hover { background-color: #dee2e6; }
        .history-box { max-height: 250px; overflow-y: auto; background-color: #ffffff; border-radius: 10px; border: 1px solid #e0e0e0; }
    </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 680px;">
    <div class="card p-4 mb-4">
        <h3 class="text-center text-primary mb-4 fw-bold">🛒 ระบบคีย์ออเดอร์ลูกค้า</h3>
        
        <form id="orderForm">
            <!-- 1. เลือกลูกค้า -->
            <div class="mb-3">
                <label class="form-label fw-bold">เลือกลูกค้า / ชื่อชีต</label>
                <select class="form-select form-select-lg" id="customerSheet" required>
                    <option value="">-- กรุณาเลือกลูกค้า --</option>
                    <option value="คุณปุ้ย+ม่วย" data-mouy="true">ร้านม่วย (ลงฝั่งขวา O11-P28)</option>
                    <option value="คุณปุ้ย+ม่วย" data-mouy="false">คุณปุ้ย (ร้านผัก) (ลงฝั่งซ้าย B11-C28)</option>
                    <option value="เจ้เสริม">เจ้เสริม</option>
                    <option value="เจ้ใหญ่">เจ้ใหญ่</option>
                    <option value="เจ้เล็ก">เจ้เล็ก</option>
                    <option value="เจ้ตา">เจ้ตา</option>
                    <option value="เจ้นิด">เจ้นิด</option>
                    <option value="โกเป้า">โกเป้า</option>
                    <option value="เจ้บ๊วย">เจ้บ๊วย</option>
                    <option value="พี่หนึ่ง">พี่หนึ่ง</option>
                    <option value="เจ้กานดา">เจ้กานดา</option>
                    <option value="เจ้หมวย">เจ้หมวย</option>
                    <option value="เจ้เซียม">เจ้เซียม</option>
                    <option value="เจ้ยู้">เจ้ยู้</option>
                    <option value="เจ้ลั้ง">เจ้ลั้ง</option>
                    <option value="เจ้เหมียว">เจ้เหมียว</option>
                    <option value="ฮ.บุ้น">ฮ.บุ้น</option>
                    <option value="พี่ราญ">พี่ราญ</option>
                    <option value="ร้านเมย์">ร้านเมย์</option>
                    <option value="เต้ย">เต้ย</option>
                    <option value="เฟิร์น">เฟิร์น</option>
                    <option value="คุณเปิ้ล">คุณเปิ้ล</option>
                    <option value="ฮ.เชิด">ฮ.เชิด</option>
                    <option value="เจ้เหมียวทุ่ง">เจ้เหมียว (ทุ่งพระเมรุ)</option>
                    <option value="เจ้แหม่ม">เจ้แหม่ม</option>
                    <option value="เล็ก ทุ่งพระเมรุ">เจ้เล็ก (ทุ่งพระเมรุ)</option>
                    <option value="คุณนิรันดร์">คุณนิรันดร์</option>
                    <option value="อุ๊">เจ้อุ๊</option>
                    <option value="เจ้เตียว">เจ้นิด (เจ้เตียว)</option>
                    <option value="เจ้นี">เจ้นี</option>
                    <option value="เจ้กบ">เจ้กบ</option>
                </select>
            </div>

            <hr class="my-4">

            <!-- 2. รายการสินค้า -->
            <h5 class="fw-bold mb-3">รายการสั่งซื้อ</h5>
            <div id="itemsList"></div>

            <button type="button" class="btn btn-add w-100 my-3 fw-bold" onclick="addItemRow()">+ เพิ่มรายการสินค้า</button>

            <!-- 3. ปุ่มส่งข้อมูล -->
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-2 fw-bold" id="submitBtn">
                บันทึกออเดอร์ลง Google Sheets
            </button>
        </form>
    </div>

    <!-- 4. ประวัติการคีย์สำเร็จ -->
    <div class="card p-4">
        <h5 class="fw-bold text-secondary mb-3">🕒 ประวัติกดส่งสำเร็จ</h5>
        <div class="history-box p-3">
            <ul id="historyList" class="list-group list-group-flush">
                <li class="list-group-item text-muted text-center py-3" id="noHistory">ยังไม่มีประวัติการส่งออเดอร์ในรอบนี้</li>
            </ul>
        </div>
    </div>
</div>

<script>
    // ⚠️ นำ Web App URL ของคุณมาวางตรงนี้
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLdO8T4kEyhx5FAodG2YvMPMZnWYULihcpd9a2QGu4zI9A9Ro67WsqDxCAxnLCaELB/exec";

    // แม่แบบสำหรับสร้างรายการสินค้า
    const itemTemplateHTML = `
        <div class="row g-2 mb-2 item-row">
            <div class="col-7">
                <select class="form-select product-name" required>
                    <option value="">-- เลือกรายการสินค้า --</option>
                    <option value="ล.สั้น">ล.สั้น (28฿)</option>
                    <option value="ล.บัว">ล.บัว (29฿)</option>
                    <option value="ผ.ท">ผ.ท (28฿)</option>
                    <option value="ญ">ญ (21฿)</option>
                    <option value="ห่อส้ม">ห่อส้ม (21฿)</option>
                    <option value="ญ.ทิวสน">ญ.ทิวสน (21฿)</option>
                    <option value="ญ.น้ำ">ญ.น้ำ (21฿)</option>
                    <option value="หั่น 5">หั่น 5 (21฿)</option>
                    <option value="ผ.ส้ม 5">ผ.ส้ม 5 (21฿)</option>
                    <option value="กลม">กลม (39฿)</option>
                    <option value="แบน">แบน (39฿)</option>
                    <option value="หยก">หยก (40฿)</option>
                    <option value="เกี๊ยว">เกี๊ยว (40฿)</option>
                    <option value="วุ้น.ฟ้าใส">วุ้น.ฟ้าใส (23฿)</option>
                    <option value="สด">สด (29.5฿)</option>
                    <option value="สดบัว.">สดบัว. (29.5฿)</option>
                    <option value="สด.ช">สด.ช (29฿)</option>
                    <option value="สดแชมป์">สดแชมป์ (28.5฿)</option>
                    <option value="วุ้น.ช">วุ้น.ช (23฿)</option>
                    <option value="วุ้นแชมป์">วุ้นแชมป์ (22.5฿)</option>
                    <option value="ก.ล">ก.ล (29฿)</option>
                    <option value="กล.">กล. (28.8฿)</option>
                    <option value="กญ.">กญ. (26฿)</option>
                    <option value="ไทร">ไทร (32฿)</option>
                    <option value="ซอสแดง">ซอสแดง (145฿)</option>
                    <option value="ซ.แดง">ซ.แดง (140฿)</option>
                    <option value="แก้ว">แก้ว (50฿)</option>
                    <option value="ดองขวด">ดองขวด (85฿)</option>
                    <option value="ขวด">ขวด (85฿)</option>
                    <option value="เตี๋ยวแพ็ค">เตี๋ยวแพ็ค (67฿)</option>
                    <option value="หมี่เจ">หมี่เจ (38฿)</option>
                    <option value="พิเศษ">พิเศษ (46฿)</option>
                </select>
            </div>
            <div class="col-3">
                <input type="number" class="form-control qty-input" placeholder="จำนวน" min="1" required inputmode="numeric">
            </div>
            <div class="col-2">
                <button type="button" class="btn btn-outline-danger w-100" onclick="removeItemRow(this)">X</button>
            </div>
        </div>
    `;

    // เพิ่มแถวสินค้าเมื่อโหลดหน้าเว็บครั้งแรก
    window.onload = function() {
        addItemRow();
    };

    function addItemRow() {
        const container = document.getElementById('itemsList');
        const div = document.createElement('div');
        div.innerHTML = itemTemplateHTML.trim();
        container.appendChild(div.firstChild);
    }

    function removeItemRow(btn) {
        const rows = document.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.closest('.item-row').remove();
        } else {
            alert('ต้องมีรายการสินค้าอย่างน้อย 1 รายการ');
        }
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("นำ_WEB_APP_URL")) {
            alert("กรุณาใส่ Web App URL ในโค้ดก่อนใช้งาน");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "⏳ กำลังบันทึกข้อมูล...";

        const customerSelect = document.getElementById('customerSheet');
        const selectedOption = customerSelect.options[customerSelect.selectedIndex];
        
        const customerSheet = selectedOption.value;
        const customerTextName = selectedOption.text;
        const isMouyTarget = selectedOption.getAttribute('data-mouy') === 'true';

        const items = [];
        let summaryTextArr = [];

        document.querySelectorAll('.item-row').forEach(row => {
            const productName = row.querySelector('.product-name').value;
            const qty = row.querySelector('.qty-input').value;
            if (productName && qty) {
                items.push({ productName: productName, qty: qty });
                summaryTextArr.push(`${productName} = ${qty}`);
            }
        });

        const payload = {
            customerSheet: customerSheet,
            isMouyTarget: isMouyTarget,
            items: items
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('✅ บันทึกข้อมูลเรียบร้อยแล้ว!');
            
            // เพิ่มประวัติการส่งสำเร็จ
            addHistoryLog(customerTextName, summaryTextArr.join(', '));
            
            // รีเซ็ตฟอร์มให้พร้อมสำหรับคีย์คนถัดไป
            resetForm();
        })
        .catch(err => {
            alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "บันทึกออเดอร์ลง Google Sheets";
        });
    });

    function resetForm() {
        document.getElementById('customerSheet').selectedIndex = 0;
        document.getElementById('itemsList').innerHTML = '';
        addItemRow(); // สร้างช่องใส่สินค้าว่างเริ่มต้นใหม่อย่างถูกต้อง
    }

    function addHistoryLog(customerName, itemsSummary) {
        const noHistory = document.getElementById('noHistory');
        if (noHistory) noHistory.remove();

        const historyList = document.getElementById('historyList');
        const now = new Date();
        const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const li = document.createElement('li');
        li.className = 'list-group-item px-0 py-2';
        li.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
                <strong class="text-primary">${customerName}</strong>
                <span class="badge bg-success">${timeString} น.</span>
            </div>
            <div class="small text-muted mt-1">📦 รายการ: ${itemsSummary}</div>
        `;
        historyList.insertBefore(li, historyList.firstChild);
    }
</script>
</body>
</html>
